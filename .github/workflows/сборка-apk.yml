name: Сборка APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Собрать Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Скачать исходники
        uses: actions/checkout@v6

      - name: Установить Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Собрать debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Подготовить русское имя APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/Лови бутылки v0.1.0-debug.apk"

      - name: Загрузить APK в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Лови бутылки — APK
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 30
