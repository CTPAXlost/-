name: Сборка и проверка APK ЕЛЦ

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: elc-v22-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Собрать и запустить игру
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-cleanup: on-success

      - name: Подготовить Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDKMANAGER" ] && [ -n "$SDK_ROOT" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          if [ -z "$SDK_ROOT" ]; then
            SDK_ROOT="$(cd "$(dirname "$SDKMANAGER")/../../.." && pwd)"
          fi
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Проверить структуру проекта
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/java/ru/elc/arcade/MainActivity.java
          test -s app/src/main/java/ru/elc/arcade/GameView.java
          test -s app/src/main/res/drawable-nodpi/menu_elc.jpg
          test -s app/src/main/res/drawable-nodpi/head_lozhkin.png
          test -s app/src/main/res/drawable-nodpi/head_rak.png
          test -s app/src/main/res/drawable-nodpi/head_korolev.png
          test -s keystore/elc-development.jks
          bash -n scripts/smoke_test.sh
          grep -q "versionName '2.2.0'" app/build.gradle

      - name: Собрать Debug и Release APK
        shell: bash
        run: |
          set -euo pipefail
          gradle clean :app:assembleDebug :app:assembleRelease :app:lintRelease --stacktrace --no-daemon

      - name: Проверить содержимое Release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          AAPT="${ANDROID_SDK_ROOT}/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" | tee apk-badging.txt
          grep -q "package: name='ru.elc.arcade'" apk-badging.txt
          grep -q "versionName='2.2.0'" apk-badging.txt
          grep -q "launchable-activity: name='ru.elc.arcade.MainActivity'" apk-badging.txt

      - name: Разрешить аппаратное ускорение эмулятора
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Запустить меню и три игровых режима
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 29
          target: default
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/smoke_test.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Подготовить APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/apk
          cp app/build/outputs/apk/release/app-release.apk "artifacts/apk/ЕЛЦ-v2.2.0.apk"
          sha256sum "artifacts/apk/ЕЛЦ-v2.2.0.apk" > "artifacts/apk/ЕЛЦ-v2.2.0.sha256.txt"

      - name: Загрузить проверенный APK
        uses: actions/upload-artifact@v4
        with:
          name: ЕЛЦ — проверенный APK v2.2.0
          path: artifacts/apk/*
          if-no-files-found: error
          retention-days: 30

      - name: Загрузить скриншоты и журналы
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ЕЛЦ — проверка v2.2.0
          path: |
            artifacts/runtime-test/*
            apk-badging.txt
            app/build/reports/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 14
