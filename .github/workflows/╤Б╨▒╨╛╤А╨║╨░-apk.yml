name: Сборка APK ЕЛЦ

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: elc-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Проверка и сборка Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Скачать проект
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Установить Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-cleanup: on-success

      - name: Подготовить Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDKMANAGER" ] && [ -n "$SDK_ROOT" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager не найден на GitHub runner" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Проверить проект и собрать APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle clean :app:lintDebug :app:assembleDebug --stacktrace --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Подготовить файл APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/ЕЛЦ-v1.0.0.apk"
          sha256sum "artifacts/ЕЛЦ-v1.0.0.apk" > "artifacts/ЕЛЦ-v1.0.0.sha256.txt"

      - name: Загрузить APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ЕЛЦ — готовый APK
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
