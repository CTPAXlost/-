plugins {
    id "com.android.application"
}

android {
    namespace "ru.elc.arcade"
    compileSdk 35

    defaultConfig {
        applicationId "ru.elc.arcade.debug"
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName "1.2.0"
    }

    signingConfigs {
        elcDevelopment {
            storeFile file("../keystore/elc-development.jks")
            storePassword "ELC-development-2026"
            keyAlias "elc"
            keyPassword "ELC-development-2026"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.elcDevelopment
        }
        release {
            signingConfig signingConfigs.elcDevelopment
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}
